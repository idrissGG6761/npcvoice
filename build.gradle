plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.example'
base { archivesName = 'npcvoice' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { npcvoice { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods { npcvoice { source sourceSets.main } }
        }
    }
}

jarJar.enable()

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // Simple Voice Chat API (the Simple Voice Chat mod itself is installed separately)
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0'

    // Offline speech-to-text, bundled into our jar. Minecraft already ships JNA, so exclude it.
    implementation('com.alphacephei:vosk:0.3.45') { exclude group: 'net.java.dev.jna' }
    jarJar(group: 'com.alphacephei', name: 'vosk', version: '[0.3.45,0.4)') {
        jarJar.pin(it, '0.3.45')
        exclude group: 'net.java.dev.jna'
    }
}

tasks.named('jar', Jar).configure { archiveClassifier = 'slim' }
tasks.named('jarJar').configure { archiveClassifier = '' }
jar.finalizedBy('reobfJar')
tasks.named('jarJar').configure { finalizedBy('reobfJarJar') }
reobf { jarJar { } }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
